[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "relay-evidence-gateway"
version = "0.1.0"
description = "Pinned-paper retrieval foundation for Relay"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.4", "uvicorn==0.54.0", "httpx==0.28.1",
  "pydantic==2.14.3", "pydantic-settings==2.16.2", "pyyaml==6.0.3",
  "pymupdf==1.28.2", "rank-bm25==0.2.2", "tiktoken==0.14.0",
  "fastembed==0.9.1", "numpy==2.4.6; python_version < '3.12'",
  "numpy==2.5.4; python_version >= '3.12'", "pandas==2.3.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.4"]

[project.scripts]
loadgen = "loadgen.run:main"

[tool.hatch.build.targets.wheel]
packages = ["relay", "eval", "standin", "loadgen", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["network: explicit opt-in network test (excluded by default)"]
addopts = "-m 'not network'"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
